
name: Build PersonnelManager EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PersonnelManager app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PersonnelManager-Windows-x64
          path: dist/PersonnelManager.exe
          
